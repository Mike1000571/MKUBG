<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MK Unblocked Games</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    /* 🔒 PASSWORD SCREEN */
    #password-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: radial-gradient(circle at center, #0a0000, #000);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lock-box {
      background: rgba(20,0,0,0.9);
      border: 1px solid #3a0000;
      padding: 30px;
      border-radius: 8px;
      text-align: center;
      box-shadow: 0 0 40px rgba(200,0,0,0.3);
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    .lock-box h2 {
      margin-bottom: 15px;
      letter-spacing: 2px;
    }

    .lock-box input {
      padding: 10px;
      width: 200px;
      border: none;
      outline: none;
      margin-bottom: 10px;
      background: #000;
      color: #fff;
      border: 1px solid #400000;
    }

    .lock-box button {
      padding: 10px 20px;
      background: #8b0000;
      border: none;
      color: #fff;
      cursor: pointer;
    }

    #error-msg {
      color: red;
      margin-top: 10px;
      font-size: 0.8rem;
    }

    /* TOP BAR */
    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 28px;
    }

    .top-left {
      font-size: 0.85rem;
      color: rgba(255,255,255,0.4);
      font-weight: bold;
      letter-spacing: 1px;
    }

    .top-nav {
      display: flex;
      gap: 22px;
    }
    .top-nav a {
      color: rgba(255,255,255,0.55);
      text-decoration: none;
      font-size: 0.85rem;
      cursor: pointer;
      transition: color 0.2s;
    }
    .top-nav a:hover { color: #fff; }

    /* CENTER */
    .center {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .mk-title {
      font-size: 3.5rem;
      font-weight: 300;
      letter-spacing: 4px;
      color: #fff;
      text-shadow: 0 0 40px rgba(200,0,0,0.5);
    }

    .mk-sub {
      font-size: 0.75rem;
      color: rgba(255,255,255,0.35);
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    /* OVERLAY PAGES */
    .page-overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: rgba(0,0,0,0.92);
      display: none;
      flex-direction: column;
    }
    .page-overlay.open { display: flex; }

    .page-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 28px;
      border-bottom: 1px solid #2a0000;
    }
    .page-logo {
      font-size: 1.1rem;
      font-weight: bold;
      color: #cc0000;
      letter-spacing: 2px;
    }
    .page-nav {
      display: flex;
      gap: 22px;
    }
    .page-nav a {
      color: rgba(255,255,255,0.55);
      text-decoration: none;
      font-size: 0.85rem;
      cursor: pointer;
      transition: color 0.2s;
    }
    .page-nav a:hover { color: #fff; }
    .page-nav a.active { color: #fff; }

    .page-body {
      flex: 1;
      overflow-y: auto;
      padding: 40px 60px;
    }

    .page-title {
      font-size: 1.2rem;
      font-weight: bold;
      color: #cc0000;
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-bottom: 24px;
      padding-bottom: 10px;
      border-bottom: 1px solid #2a0000;
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 14px;
    }

    /* GAME CARD */
    .game-card {
      background: #0d0000;
      border: 1px solid #2a0000;
      cursor: pointer;
      padding: 8px;
      text-align: center;
      transition: 0.2s;
    }
    .game-card:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px rgba(200,0,0,0.5);
    }
    .game-card img {
      width: 100%;
      height: 80px;
      object-fit: cover;
    }
    .game-title {
      font-size: 0.75rem;
      color: #ccc;
      margin-top: 5px;
    }

    /* GAME PLAYER */
    #game-player {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 999;
      display: none;
      flex-direction: column;
    }
    #game-player iframe {
      flex: 1;
      border: none;
    }
    #close-game {
      background: #8b0000;
      border: none;
      color: #fff;
      padding: 10px;
      cursor: pointer;
    }

    .sound-empty { color: #444; margin-top: 20px; }
    .credits-box { color: #888; line-height: 2.2; }

  </style>
</head>
<body>

<!-- 🔒 PASSWORD -->
<div id="password-screen">
  <div class="lock-box">
    <h2>MK Access</h2>
    <input id="password-input" type="password" placeholder="Enter password">
    <button onclick="checkPassword()">Enter</button>
    <div id="error-msg"></div>
  </div>
</div>

<canvas id="stars"></canvas>

<div class="topbar">
  <div class="top-left">MK</div>
  <nav class="top-nav">
    <a onclick="closePage()">Home</a>
    <a onclick="openPage('games')">Games</a>
    <a onclick="openPage('soundboard')">Soundboard</a>
    <a onclick="openPage('credits')">Credits</a>
  </nav>
</div>

<div class="center">
  <div class="mk-title">MK</div>
  <div class="mk-sub">Unblocked Games</div>
</div>

<div class="page-overlay" id="overlay">
  <div class="page-topbar">
    <div class="page-logo">MK</div>
    <nav class="page-nav">
      <a onclick="closePage()">Home</a>
      <a onclick="openPage('games')" id="nav-games">Games</a>
      <a onclick="openPage('soundboard')" id="nav-soundboard">Soundboard</a>
      <a onclick="openPage('credits')" id="nav-credits">Credits</a>
      <a onclick="closePage()" style="color:#444; margin-left:8px;">✕</a>
    </nav>
  </div>

  <div class="page-body">

    <div id="page-games" style="display:none;">
      <div class="page-title">Games</div>
      <div class="game-grid">

        <!-- SLOPE GAME -->
        <div class="game-card" onclick="openGame('https://ubg365.github.io/slope/')">
          <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/3a/Neon_ball_icon.png/240px-Neon_ball_icon.png">
          <div class="game-title">Slope</div>
        </div>

      </div>
    </div>

    <div id="page-soundboard" style="display:none;">
      <div class="page-title">Soundboard</div>
      <div class="sound-empty">No sounds added yet — sounds will appear here.</div>
    </div>

    <div id="page-credits" style="display:none;">
      <div class="page-title">Credits</div>
      <div class="credits-box">
        <div>Creator of Site: <strong>MK</strong></div>
        <div>And Domenics Weird BTW</div>
      </div>
    </div>

  </div>
</div>

<!-- GAME PLAYER -->
<div id="game-player">
  <button id="close-game" onclick="closeGame()">← Back</button>
  <iframe id="game-frame"></iframe>
</div>

<script>
  const canvas = document.getElementById('stars');
  const ctx = canvas.getContext('2d');
  let stars = [];

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }

  function initStars() {
    stars = [];
    for (let i = 0; i < 200; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 1.2 + 0.2,
        o: Math.random() * 0.7 + 0.2,
        speed: Math.random() * 0.15 + 0.02
      });
    }
  }

  function drawStars() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    stars.forEach(s => {
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${s.o})`;
      ctx.fill();
      s.y -= s.speed;
      if (s.y < 0) { s.y = canvas.height; s.x = Math.random() * canvas.width; }
    });
    requestAnimationFrame(drawStars);
  }

  resize(); initStars(); drawStars();
  window.addEventListener('resize', () => { resize(); initStars(); });

  function openPage(id) {
    document.getElementById('overlay').classList.add('open');
    ['games','soundboard','credits'].forEach(p => {
      document.getElementById('page-' + p).style.display = 'none';
    });
    document.getElementById('page-' + id).style.display = 'block';
  }

  function closePage() {
    document.getElementById('overlay').classList.remove('open');
  }

  function openGame(url) {
    document.getElementById("game-player").style.display = "flex";
    document.getElementById("game-frame").src = url;
  }

  function closeGame() {
    document.getElementById("game-player").style.display = "none";
    document.getElementById("game-frame").src = "";
  }

  const PASSWORD = "MKISPAID";

  function checkPassword() {
    const input = document.getElementById('password-input').value;
    if (input === PASSWORD) {
      const screen = document.getElementById('password-screen');
      screen.style.opacity = "0";
      setTimeout(() => screen.style.display = "none", 400);
    } else {
      document.getElementById('error-msg').textContent = "Wrong password";
    }
  }

  document.addEventListener("keydown", function(e) {
    if (e.key === "Enter") checkPassword();
  });
</script>

</body>
</html>
